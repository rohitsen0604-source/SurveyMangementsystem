services:
  - type: web
    name: survey-management-system
    env: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /login.php
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: survey_db
      - key: DB_PORT
        value: "3306"
